# All variables intended for modification should be placed in this file.

# All variables within this role should have a prefix of "edpm_ssh_key_rotation"

# seconds between retries for download tasks
edpm_ssh_key_rotation_download_delay: "{{ edpm_download_delay | default(60) }}"

# number of retries for download tasks
edpm_ssh_key_rotation_download_retries: "{{ edpm_download_retries | default(5) }}"


# Backup existing keys before rotation
edpm_ssh_key_rotation_backup_keys: true

# Backup directory for old SSH keys
edpm_ssh_key_rotation_backup_dir: "/var/lib/edpm-config/ssh-keys-backup"

# User for authorized keys rotation
edpm_ssh_key_rotation_user: "{{ ansible_user | default('root') }}"

# Authorized keys file location
edpm_ssh_key_rotation_authorized_keys_file: "/home/{{ edpm_ssh_key_rotation_user }}/.ssh/authorized_keys"

# SSH directory for the user
edpm_ssh_key_rotation_ssh_dir: "/home/{{ edpm_ssh_key_rotation_user }}/.ssh"

# New authorized key entry (provided by playbook)
edpm_ssh_key_rotation_new_key_entry: "{{ edpm_ssh_key_rotation_new_public_key | default('') }}"

# Force key rotation even if key exists
edpm_ssh_key_rotation_force: false

# Cleanup old backup keys after successful rotation
edpm_ssh_key_rotation_cleanup_backups: false

# Maximum number of backup generations to keep
edpm_ssh_key_rotation_max_backups: 3
