- name: Run SSH key rotation setup and backup tasks as root
  become: true
  block:
    - name: Create backup directory for SSH keys
      ansible.builtin.file:
        path: "{{ edpm_ssh_key_rotation_backup_dir }}"
        state: directory
        mode: "0700"
        owner: root
        group: root
      when: edpm_ssh_key_rotation_backup_keys | bool

    - name: Create timestamped backup subdirectory
      ansible.builtin.file:
        path: "{{ edpm_ssh_key_rotation_backup_dir }}/{{ ansible_date_time.epoch }}"
        state: directory
        mode: "0700"
        owner: root
        group: root
      register: backup_timestamp_dir
      when: edpm_ssh_key_rotation_backup_keys | bool

    - name: Check if authorized keys file exists
      ansible.builtin.stat:
        path: "{{ edpm_ssh_key_rotation_authorized_keys_file }}"
      register: authorized_keys_exists
      when: edpm_ssh_key_rotation_backup_keys | bool

    - name: Backup existing authorized keys file
      ansible.builtin.copy:
        src: "{{ edpm_ssh_key_rotation_authorized_keys_file }}"
        dest: "{{ backup_timestamp_dir.path }}/authorized_keys"
        mode: "0600"
        owner: root
        group: root
        remote_src: true
      when: 
        - edpm_ssh_key_rotation_backup_keys | bool
        - authorized_keys_exists.stat.exists | bool

    - name: Create backup manifest
      ansible.builtin.copy:
        content: |
          SSH Authorized Keys Rotation Backup
          ===================================
          Timestamp: {{ ansible_date_time.iso8601 }}
          Hostname: {{ ansible_hostname }}
          User: {{ edpm_ssh_key_rotation_user }}
          Authorized Keys File: {{ edpm_ssh_key_rotation_authorized_keys_file }}
          Backup Directory: {{ backup_timestamp_dir.path }}
        dest: "{{ backup_timestamp_dir.path }}/backup_manifest.txt"
        mode: "0644"
        owner: root
        group: root
      when: edpm_ssh_key_rotation_backup_keys | bool
