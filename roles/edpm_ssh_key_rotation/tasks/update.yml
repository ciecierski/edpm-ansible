- name: Run SSH authorized keys update tasks as root
  become: true
  block:
    - name: Verify authorized keys file permissions
      ansible.builtin.file:
        path: "{{ edpm_ssh_key_rotation_authorized_keys_file }}"
        mode: "0600"
        owner: "{{ edpm_ssh_key_rotation_user }}"
        group: "{{ edpm_ssh_key_rotation_user }}"
      when: edpm_ssh_key_rotation_authorized_keys_file is defined

    - name: Display rotation completion message
      ansible.builtin.debug:
        msg: |
          SSH Authorized Keys Rotation Completed
          =====================================
          User: {{ edpm_ssh_key_rotation_user }}
          Authorized Keys File: {{ edpm_ssh_key_rotation_authorized_keys_file }}
          New key entry has been added successfully.