- name: Run SSH authorized keys rotation tasks as root
  become: true
  block:
    - name: Check if new authorized key entry is provided
      ansible.builtin.assert:
        that:
          - edpm_ssh_key_rotation_new_key_entry != ""
        fail_msg: "New authorized key entry is not provided. Please set edpm_ssh_key_rotation_new_public_key variable."

    - name: Ensure SSH directory exists
      ansible.builtin.file:
        path: "{{ edpm_ssh_key_rotation_ssh_dir }}"
        state: directory
        mode: "0700"
        owner: "{{ edpm_ssh_key_rotation_user }}"
        group: "{{ edpm_ssh_key_rotation_user }}"

    - name: Check if authorized keys file exists
      ansible.builtin.stat:
        path: "{{ edpm_ssh_key_rotation_authorized_keys_file }}"
      register: authorized_keys_file_exists

    - name: Read existing authorized keys
      ansible.builtin.slurp:
        src: "{{ edpm_ssh_key_rotation_authorized_keys_file }}"
      register: existing_authorized_keys
      when: authorized_keys_file_exists.stat.exists

    - name: Create new authorized keys content
      ansible.builtin.set_fact:
        new_authorized_keys_content: |
          {{ existing_authorized_keys.content | b64decode if authorized_keys_file_exists.stat.exists else '' }}
          {{ edpm_ssh_key_rotation_new_key_entry }}
      when: edpm_ssh_key_rotation_new_key_entry != ""

    - name: Create authorized keys file with new entry
      ansible.builtin.copy:
        content: "{{ new_authorized_keys_content }}"
        dest: "{{ edpm_ssh_key_rotation_authorized_keys_file }}"
        mode: "0600"
        owner: "{{ edpm_ssh_key_rotation_user }}"
        group: "{{ edpm_ssh_key_rotation_user }}"
      when: edpm_ssh_key_rotation_new_key_entry != ""

    - name: Verify authorized keys file exists
      ansible.builtin.stat:
        path: "{{ edpm_ssh_key_rotation_authorized_keys_file }}"
      register: authorized_keys_verify

    - name: Assert authorized keys file exists
      ansible.builtin.assert:
        that:
          - authorized_keys_verify.stat.exists
        fail_msg: "Authorized keys file {{ edpm_ssh_key_rotation_authorized_keys_file }} does not exist after rotation"

    - name: Display authorized keys file info
      ansible.builtin.debug:
        msg: "Authorized keys file updated for user {{ edpm_ssh_key_rotation_user }} at {{ edpm_ssh_key_rotation_authorized_keys_file }}"