argument_specs:
  main:
    short_description: The main entry point for the edpm_ssh_key_rotation role.
    description: |
      This role provides SSH authorized keys rotation functionality for EDPM nodes.
      It can backup existing authorized keys and add new key entries.
    options:
      edpm_ssh_key_rotation_backup_keys:
        description: Backup existing authorized keys before rotation
        type: bool
        default: true
      edpm_ssh_key_rotation_backup_dir:
        description: Backup directory for old authorized keys
        type: str
        default: "/var/lib/edpm-config/ssh-keys-backup"
      edpm_ssh_key_rotation_user:
        description: User for authorized keys rotation
        type: str
        default: "{{ ansible_user | default('root') }}"
      edpm_ssh_key_rotation_force:
        description: Force key rotation even if key exists
        type: bool
        default: false
      edpm_ssh_key_rotation_cleanup_backups:
        description: Cleanup old backup keys after successful rotation
        type: bool
        default: false
      edpm_ssh_key_rotation_max_backups:
        description: Maximum number of backup generations to keep
        type: int
        default: 3
      edpm_ssh_key_rotation_new_public_key:
        description: New public key content to add to authorized_keys
        type: str
        default: ""
